name: opencode

on:
  issues:
    types: [opened]

jobs:
  opencode:
    # リポジトリの持ち主が作ったIssueだけ実行（他人による悪用を防ぐ）
    if: github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    env:
      TASK_PROMPT: |
        次のIssueの内容を実装してください。

        Issue番号: #${{ github.event.issue.number }}
        タイトル: ${{ github.event.issue.title }}
        本文:
        ${{ github.event.issue.body }}

        進め方:
        1. 関連するファイルを読み、変更方針を決める。
        2. 実装する。要件に関係ないファイルは変更しない。
        3. `npm run build` を実行する。エラーが出たら原因を直して再実行する。成功するまで繰り返す（最大3回）。
        4. Issueの完了条件を1つずつ確認する。満たしていないものがあれば修正する。
        5. 最後に、変更したファイルと、確認した結果を簡潔に報告する。

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: opencode (primary - 3.8 Flash)
        id: primary
        continue-on-error: true
        uses: anomalyco/opencode/github@latest
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USE_GITHUB_TOKEN: "true"
        with:
          model: google/gemini-3.8-flash
          prompt: ${{ env.TASK_PROMPT }}

      - name: opencode (fallback 1 - 3.5 Flash Lite)
        id: fallback1
        if: steps.primary.outcome == 'failure'
        continue-on-error: true
        uses: anomalyco/opencode/github@latest
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USE_GITHUB_TOKEN: "true"
        with:
          model: google/gemini-3.5-flash-lite
          prompt: ${{ env.TASK_PROMPT }}

      - name: opencode (fallback 2 - 3.1 Flash Lite)
        if: steps.fallback1.outcome == 'failure'
        uses: anomalyco/opencode/github@latest
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USE_GITHUB_TOKEN: "true"
        with:
          model: google/gemini-3.1-flash-lite
          prompt: ${{ env.TASK_PROMPT }}
