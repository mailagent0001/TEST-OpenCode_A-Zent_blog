name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      github.event.comment.user.type != 'Bot' &&
      (contains(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false


      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci


          

      # 1番手: 高性能だが枠が小さい（1日20回）
      - name: opencode (primary - 3.8 Flash)
        id: primary
        continue-on-error: true
        uses: anomalyco/opencode/github@latest
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USE_GITHUB_TOKEN: "true"
        with:
          model: google/gemini-3.8-flash

      # 2番手: 1番手が失敗したときだけ（1日500回）
      - name: opencode (fallback 1 - 3.5 Flash Lite)
        id: fallback1
        if: steps.primary.outcome == 'failure'
        continue-on-error: true
        uses: anomalyco/opencode/github@latest
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USE_GITHUB_TOKEN: "true"
        with:
          model: google/gemini-3.5-flash-lite

      # 3番手: 2番手も失敗したときだけ（1日500回）
      - name: opencode (fallback 2 - 3.1 Flash Lite)
        if: steps.fallback1.outcome == 'failure'
        uses: anomalyco/opencode/github@latest
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USE_GITHUB_TOKEN: "true"
        with:
          model: google/gemini-3.1-flash-lite
